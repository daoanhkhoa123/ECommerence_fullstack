spring.application.name=backend
server.port=3100

# Debug loggin
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG


# PostgreSQL connection
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/backend_db}
spring.datasource.username=${DATABASE_USER:admin_backend}
spring.datasource.password=${DATABASE_PASSWORD:admin123}

# JPA / Hibernate
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security
logging.level.org.springframework.security=DEBUG

# Kafka Configuration
# Kafka bootstrap
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Consumer with ErrorHandlingDeserializer
spring.kafka.consumer.group-id=backend-group
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.backend.kafka.dto.ChatMessageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
